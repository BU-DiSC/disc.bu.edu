{% assign p = include.paper %}
<div class="summary-item">
  <div class="summary-title"><a href="{{ p.url | relative_url }}">{{ p.title }}</a></div>
  <div class="summary-excerpt">
    <p>{% if p.venue %}<em>{{ p.venue }}</em><br>{% endif %}{{ p.authors }}</p>
    {% if p.links %}<p>{% for l in p.links %}<a href="{{ l.url }}" target="_blank" rel="noopener">{{ l.label }}</a>{% unless forloop.last %} | {% endunless %}{% endfor %}</p>{% endif %}
  </div>
</div>
