<header class="site-header">
  <div class="header-inner">
    <a class="logo" href="{{ '/' | relative_url }}"><img src="{{ '/assets/img/logo.png' | relative_url }}" alt="{{ site.title }}" width="100" height="100"></a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Menu"><span></span><span></span><span></span></button>
    <nav id="site-nav" class="main-nav">
      <ul>
      {%- for item in site.data.navigation %}
        {%- if item.children %}
        <li class="folder">
          <button class="folder-toggle" aria-expanded="false">{{ item.title }}</button>
          <ul class="subnav">
            {%- for c in item.children %}
            <li><a href="{{ c.url | relative_url }}"{% if c.url contains '://' %} target="_blank" rel="noopener"{% endif %}>{{ c.title }}</a></li>
            {%- endfor %}
          </ul>
        </li>
        {%- else %}
        <li{% if item.button %} class="nav-button"{% endif %}><a href="{{ item.url | relative_url }}"{% if page.url == item.url or page.permalink == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {%- endif %}
      {%- endfor %}
      </ul>
    </nav>
  </div>
</header>
