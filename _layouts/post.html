---
layout: default
---
<article class="entry">
  <div class="entry-dateline"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></div>
  <h1 class="entry-title">{{ page.title }}</h1>
  <div class="sqs-content">{{ content }}</div>
</article>
{% if page.previous or page.next %}
<nav class="pagination">
  {% if page.next %}<a class="newer" href="{{ page.next.url | relative_url }}"><span class="label">Newer Post</span><span class="title">{{ page.next.title }}</span></a>{% else %}<span></span>{% endif %}
  {% if page.previous %}<a class="older" href="{{ page.previous.url | relative_url }}"><span class="label">Older Post</span><span class="title">{{ page.previous.title }}</span></a>{% endif %}
</nav>
{% endif %}
