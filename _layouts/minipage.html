---
layout: default
---
{% if page.external_url %}
<p>This page has moved to <a href="{{ page.external_url }}">{{ page.external_url }}</a>.</p>
<script>location.replace({{ page.external_url | jsonify }});</script>
{% else %}
<article class="prose"><h1 class="page-title">{{ page.title }}</h1>{{ content }}</article>
{% endif %}
