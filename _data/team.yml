join_us: 'We are looking for motivated students to join the team. [**Read this**](https://cs-people.bu.edu/mathan/#prospective-students) **before sending me an email.**


  **MS & Undergrad:** Current BU students may join the lab through a Directed Study or [UROP](https://www.bu.edu/urop/). Prerequisites: CS 460 Intro to Database Systems or 660 Grad Intro to Database Systems or CS 561 Data Systems Architectures.


  **PhD:** The graduate program deadline is December 15. A summary of application requirements is provided on the [BU CS website](https://www.bu.edu/cs/phd-program/phd/).'
